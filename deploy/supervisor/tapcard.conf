; TapCard — worker antrean & scheduler. Salin ke /etc/supervisor/conf.d/tapcard.conf lalu
;   supervisorctl reread && supervisorctl update
; Urutan antrean = prioritas: taps (pencatatan tap) paling dulu, render (gambar/PDF) paling akhir.

[program:tapcard-queue]
command=php /var/www/tapcard/current/artisan queue:work --queue=taps,notify,leads,default,render --sleep=1 --tries=3 --max-time=3600 --memory=192
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/tapcard/queue.log
stdout_logfile_maxbytes=20MB

; Realtime (Laravel Reverb) — WebSocket untuk notifikasi; Nginx meneruskan wss://ws.{domain} ke sini
[program:tapcard-reverb]
command=php /var/www/tapcard/current/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/tapcard/reverb.log
stdout_logfile_maxbytes=10MB
minfds=10000

[program:tapcard-schedule]
command=php /var/www/tapcard/current/artisan schedule:work
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/tapcard/schedule.log
stdout_logfile_maxbytes=5MB
