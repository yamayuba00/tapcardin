# TapCard — Nginx + PHP-FPM (TRD §11). Ganti `tapcard.id` dan path rilis sesuai server.
# Satu server block melayani semua host: tap., app., admin., {slug}., dan domain dasar —
# Laravel memilih rute dari Host (routes/*.php), jadi Nginx cukup meneruskan Host apa adanya.

upstream tapcard_php    { server unix:/run/php/tapcard.sock; }
upstream tapcard_stream { server unix:/run/php/tapcard-stream.sock; }

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tapcard.id *.tapcard.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tapcard.id *.tapcard.id;

    # Sertifikat wildcard (DNS-01), mis. certbot --dns-cloudflare -d tapcard.id -d '*.tapcard.id'
    ssl_certificate     /etc/letsencrypt/live/tapcard.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapcard.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/tapcard/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;   # unggahan avatar/aset Studio (validasi ukuran ada di Laravel)

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vcard;

    # Aset Vite ber-hash → cache setahun, immutable
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    # Unggahan pengguna (storage:link). Nama file acak → aman di-cache lama.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # SSE notifikasi: pool PHP-FPM terpisah agar koneksi panjang tidak menghabiskan worker utama,
    # dan buffering dimatikan supaya event langsung sampai ke browser.
    location = /api/stream {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass tapcard_stream;
        fastcgi_buffering off;
        fastcgi_read_timeout 60s;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;   # realpath → symlink `current` aman saat rilis
        fastcgi_pass tapcard_php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 30s;
        internal;
    }

    # PHP lain tidak pernah dieksekusi
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
