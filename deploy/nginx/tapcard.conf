# TapCard — Nginx + PHP-FPM. Dipasang otomatis oleh deploy/install.sh (placeholder TAPCARD_DOMAIN diganti
# dengan domain Anda). Satu server block melayani semua host: domain utama (landing), app. (aplikasi),
# tap. (resolver kartu), panel. (panel pemilik), dan {slug}. workspace perusahaan — Laravel memilih rute dari Host.
# Kompatibel Nginx 1.18–1.27 (Ubuntu 22.04/24.04): memakai `listen 443 ssl http2`, bukan `http2 on`.

upstream tapcard_php    { server unix:/run/php/tapcard.sock; }
upstream tapcard_stream { server unix:/run/php/tapcard-stream.sock; }

# HTTP → HTTPS, kecuali tantangan Let's Encrypt (perpanjangan sertifikat otomatis lewat webroot)
server {
    listen 80;
    listen [::]:80;
    server_name TAPCARD_DOMAIN *.TAPCARD_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TAPCARD_DOMAIN *.TAPCARD_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/TAPCARD_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TAPCARD_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tapcard_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/tapcard/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;   # unggahan avatar/aset Studio/CSV (validasi ukuran ada di Laravel)

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vcard application/manifest+json;

    # Aset Vite ber-hash → cache setahun, immutable
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location /icons/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    # Service worker PWA & manifest harus selalu dicek ulang agar versi baru langsung terpasang
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }
    # Unggahan pengguna (storage:link). Nama file acak → aman di-cache lama.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # SSE notifikasi: pool PHP-FPM terpisah agar koneksi panjang tidak menghabiskan worker utama,
    # dan buffering dimatikan supaya event langsung sampai ke browser.
    location = /api/stream {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass tapcard_stream;
        fastcgi_buffering off;
        fastcgi_read_timeout 60s;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;   # realpath → symlink `current` aman saat rilis
        fastcgi_pass tapcard_php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 30s;
        internal;
    }

    # PHP lain tidak pernah dieksekusi
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
