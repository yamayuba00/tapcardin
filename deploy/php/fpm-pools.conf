; TapCard — pool PHP-FPM. Salin ke /etc/php/8.3/fpm/pool.d/tapcard.conf (hapus www.conf bila tak dipakai).
; Hitung pm.max_children ≈ (RAM untuk PHP) / (RSS rata-rata worker, ~40–60 MB). Contoh di bawah untuk VPS 2 GB.

[tapcard]
user = www-data
group = www-data
listen = /run/php/tapcard.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500          ; daur ulang worker, cegah kebocoran memori
request_terminate_timeout = 30s
request_slowlog_timeout = 3s   ; target resolver p95 < 300 ms (TRD §10) — yang > 3 s dicatat
slowlog = /var/log/php-fpm/tapcard-slow.log
php_admin_value[memory_limit] = 256M

; Pool khusus /api/stream (SSE). Tiap tab terbuka menahan 1 worker ±25 s lalu klien reconnect,
; jadi max_children di sini = jumlah tab notifikasi serentak yang sanggup dilayani.
; Bila pengguna aktif serentak > ~150, pindahkan notifikasi ke Reverb/WebSocket (TRD §4.8).
[tapcard-stream]
user = www-data
group = www-data
listen = /run/php/tapcard-stream.sock
listen.owner = www-data
listen.group = www-data

pm = ondemand
pm.max_children = 60
pm.process_idle_timeout = 30s
pm.max_requests = 200
request_terminate_timeout = 45s
php_admin_value[memory_limit] = 64M
php_admin_value[output_buffering] = 0
