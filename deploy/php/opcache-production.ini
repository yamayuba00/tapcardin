; TapCard — OPcache produksi. Salin ke /etc/php/8.3/fpm/conf.d/99-tapcard-opcache.ini
; validate_timestamps=0: PHP tidak memeriksa perubahan file → WAJIB reload php-fpm setiap rilis
; (deploy.sh melakukannya). Di lokal tetap validate_timestamps=1.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M

realpath_cache_size=4096K
realpath_cache_ttl=600
expose_php=Off
