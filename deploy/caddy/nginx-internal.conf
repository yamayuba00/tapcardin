# TapCard — Nginx internal (HTTP saja, hanya 127.0.0.1:8081). Caddy menerima TLS untuk semua host dan meneruskan
# ke sini. Isi blok aplikasi sama dengan deploy/nginx/tapcard.conf (hasil salin, bukan versi terpisah).
# Dipasang oleh deploy/caddy/install.sh.

upstream tapcard_php    { server unix:/run/php/tapcard.sock; }
upstream tapcard_stream { server unix:/run/php/tapcard-stream.sock; }

server {
    listen 127.0.0.1:8081;
    server_name _;


    root /var/www/tapcard/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;   # unggahan avatar/aset Studio/CSV (validasi ukuran ada di Laravel)

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vcard application/manifest+json;

    # Aset Vite ber-hash → cache setahun, immutable
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location /icons/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    # Service worker PWA & manifest harus selalu dicek ulang agar versi baru langsung terpasang
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }
    # Unggahan pengguna (storage:link). Nama file acak → aman di-cache lama.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    # robots.txt dibuat Laravel per host (situs, tap., app., panel., perusahaan) — bukan file statis
    location = /robots.txt  { access_log off; try_files /index.php?$query_string =404; }

    # SSE notifikasi: pool PHP-FPM terpisah agar koneksi panjang tidak menghabiskan worker utama,
    # dan buffering dimatikan supaya event langsung sampai ke browser.
    location = /api/stream {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass tapcard_stream;
        fastcgi_buffering off;
        fastcgi_read_timeout 60s;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;   # realpath → symlink `current` aman saat rilis
        fastcgi_pass tapcard_php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 30s;
        internal;
    }

    # PHP lain tidak pernah dieksekusi
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
